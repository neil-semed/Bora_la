name: Gerar APK do Motorista

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-apk:
    name: Criar instalador Android
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar arquivos do projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Usar o ícone do Bora Lá no aplicativo
        run: |
          rm android/app/src/main/res/drawable/app_icon.xml
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp assets/favicon-512.png android/app/src/main/res/drawable-nodpi/app_icon.png

      - name: Baixar Gradle
        run: |
          curl --fail --location --silent --show-error \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            --output /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt

      - name: Gerar APK instalável
        run: |
          /opt/gradle-8.9/bin/gradle -p android :app:assembleDebug --no-daemon
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/Bora-La-Motorista.apk

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Bora-La-Motorista-APK
          path: output/Bora-La-Motorista.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publicar APK em link permanente
        uses: softprops/action-gh-release@v2
        with:
          tag_name: motorista-apk
          name: Aplicativo Bora Lá — Motorista
          body: |
            Instalador Android do perfil Motorista.
            Baixe o arquivo **Bora-La-Motorista.apk** diretamente no celular e confirme a instalação.
          files: output/Bora-La-Motorista.apk
          overwrite_files: true
          make_latest: true
