<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#059669" />
  <title>Bora Lá - Motorista</title>

  <!-- Este é o "app" instalável só do Motorista: mesmo sistema de sempre (mesmo
       login, mesmo app.js), mas com nome/ícone/manifest próprios, pra virar um
       atalho separado na tela inicial do celular (Android e iPhone) e, se quiser
       instalar como .apk de verdade no Android, é este arquivo que vira o "site"
       empacotado pelo PWABuilder (veja README.md, seção "App do Motorista"). -->
  <link rel="manifest" href="manifest-motorista.json" />
  <link rel="icon" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bora Lá Motorista" />
  <meta name="mobile-web-app-capable" content="yes" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .hidden { display: none !important; }
    .toast { position: fixed; top: 20px; right: 20px; z-index: 9999; max-width: 90vw; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen" data-page="login" data-pwa="motorista">

  <!-- Mesma tela de login de sempre (index.html) - só a "casca" (nome/ícone/manifest)
       é diferente. Depois de entrar, cai no app.html normal (que já mostra só as
       telas do perfil Motorista). -->
  <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4 bg-[#F6FFFC]">
    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
      <div class="text-center mb-6">
        <img src="assets/logo_bora-la.png" alt="Bora Lá" class="w-full max-w-xs mx-auto" onerror="this.style.display='none'" />
        <p class="text-slate-500 -mt-2">App do Motorista • Semed Nova Lima</p>
      </div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">E-mail</label>
          <input type="email" id="loginEmail" required placeholder="seu@email.com" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
          <div class="relative">
            <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full px-4 py-2.5 pr-11 border border-slate-300 rounded-lg" />
            <button type="button" id="togglePasswordBtn" onclick="togglePasswordVisibility()" aria-label="Mostrar senha" class="absolute inset-y-0 right-0 flex items-center px-3 text-slate-400 hover:text-slate-600">
              <span id="togglePasswordIcon">👁️</span>
            </button>
          </div>
        </div>
        <button type="submit" id="loginSubmitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-lg disabled:opacity-60 disabled:cursor-not-allowed">
          Entrar
        </button>
      </form>

      <div id="demoNotice" class="mt-5 text-xs text-slate-500 bg-slate-50 border border-slate-200 rounded-lg p-3 hidden">
        <strong>Modo demonstração</strong> (Supabase ainda não configurado): use qualquer senha e um
        e-mail contendo <code>motorista</code> pra testar. Ex: <code>motorista@teste.com</code>.
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="toast hidden bg-white border rounded-lg shadow-xl px-4 py-3">
    <span id="toastMsg" class="text-sm font-medium"></span>
  </div>

  <script src="app.js"></script>
</body>
</html>
