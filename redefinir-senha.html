<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redefinir senha — Bora Lá</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8"></script><script src="https://cdn.tailwindcss.com/3.4.17"></script></head>
<body class="min-h-screen bg-emerald-50 flex items-center justify-center p-4"><main class="bg-white max-w-md w-full rounded-2xl shadow p-7"><img src="assets/logo_bora-la.png" alt="Bora Lá" class="max-w-[190px] mx-auto mb-5"><h1 class="text-xl font-bold text-slate-800">Definir nova senha</h1><p class="text-sm text-slate-500 mt-1 mb-5">Escolha uma senha nova para a sua conta.</p><form id="resetForm" class="space-y-4"><input id="newPassword" type="password" minlength="8" required placeholder="Nova senha (mínimo 8 caracteres)" class="w-full p-3 border rounded-lg"><input id="confirmPassword" type="password" minlength="8" required placeholder="Repita a nova senha" class="w-full p-3 border rounded-lg"><button class="w-full bg-emerald-600 text-white py-3 rounded-lg font-semibold">Salvar nova senha</button></form><p id="message" class="text-sm mt-4"></p></main><script>const s=supabase.createClient('https://rjuzhscynuleypaewgak.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqdXpoc2N5bnVsZXlwYWV3Z2FrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2NTQwNDAsImV4cCI6MjEwNDIzMDA0MH0.enT2gJB4dy2xz_Z91tPY4ysoJ-GEEn2dpo_RHiy5jAs');document.getElementById('resetForm').onsubmit=async e=>{e.preventDefault();const a=newPassword.value,b=confirmPassword.value,m=document.getElementById('message');if(a!==b){m.textContent='As senhas não coincidem.';m.className='text-sm mt-4 text-red-600';return}const{error}=await s.auth.updateUser({password:a});if(error){m.textContent='Link inválido ou expirado. Solicite uma nova recuperação.';m.className='text-sm mt-4 text-red-600';return}m.textContent='Senha atualizada. Você já pode entrar.';m.className='text-sm mt-4 text-emerald-700';setTimeout(()=>location.href='index.html',1400)}</script></body></html>
