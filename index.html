<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🚌 Bora Lá - Excursões</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-emerald-600 to-teal-800">
    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
      <div class="text-center mb-8">
        <div class="text-6xl mb-3">🚌</div>
        <h1 class="text-3xl font-bold text-slate-800">Bora Lá</h1>
        <p class="text-slate-500 mt-1">Sistema de Excursões • Semed Nova Lima</p>
      </div>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">E-mail</label>
          <input type="email" id="loginEmail" required placeholder="seu@email.com" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
          <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg" />
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-lg">
          Entrar no Sistema
        </button>
      </form>
    </div>
  </div>

  <div id="appScreen" class="hidden">
    <div class="flex min-h-screen">
      <aside class="w-64 bg-emerald-700 text-white p-5">
        <div class="flex items-center gap-2 mb-6">
          <span class="text-3xl">🚌</span>
          <h2 class="font-bold text-lg">Bora Lá</h2>
        </div>
        <nav class="space-y-2">
          <a onclick="showScreen('dashboard')" class="block px-3 py-2 rounded hover:bg-emerald-600 cursor-pointer">📊 Dashboard</a>
          <a onclick="showScreen('agenda')" class="block px-3 py-2 rounded hover:bg-emerald-600 cursor-pointer">📅 Agenda</a>
          <a onclick="showScreen('solicitacao')" class="block px-3 py-2 rounded hover:bg-emerald-600 cursor-pointer">➕ Nova Solicitação</a>
        </nav>
      </aside>

      <main class="flex-1 p-6">
        <section id="screen-dashboard">
          <h1 class="text-2xl font-bold mb-4">Dashboard</h1>
          <div class="grid grid-cols-3 gap-4">
            <div class="bg-white p-5 rounded-lg border">
              <div class="text-3xl font-bold text-emerald-600">5</div>
              <div class="text-sm text-slate-600">Viagens Hoje</div>
            </div>
            <div class="bg-white p-5 rounded-lg border">
              <div class="text-3xl font-bold text-amber-600">3</div>
              <div class="text-sm text-slate-600">Pendentes</div>
            </div>
            <div class="bg-white p-5 rounded-lg border">
              <div class="text-3xl font-bold text-blue-600">12</div>
              <div class="text-sm text-slate-600">Aprovadas</div>
            </div>
          </div>
        </section>

        <section id="screen-agenda" class="hidden">
          <h1 class="text-2xl font-bold mb-4">Agenda Mestra</h1>
          <div class="bg-white rounded-lg border p-5">
            <p class="text-slate-600">Lista de viagens aparecerá aqui...</p>
          </div>
        </section>

        <section id="screen-solicitacao" class="hidden">
          <h1 class="text-2xl font-bold mb-4">Nova Solicitação</h1>
          <div class="bg-white rounded-lg border p-5">
            <p class="text-slate-600">Formulário de solicitação...</p>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('appScreen').classList.remove('hidden');
    });

    function showScreen(name) {
      document.querySelectorAll('[id^="screen-"]').forEach(el => el.classList.add('hidden'));
      document.getElementById('screen-' + name).classList.remove('hidden');
    }
  </script>
</body>
</html>
