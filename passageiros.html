<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bora Lá - Cadastro de Passageiros</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-100 min-h-screen"><main class="max-w-4xl mx-auto p-4 sm:p-6"><div class="bg-white rounded-2xl border shadow-sm p-5 sm:p-7"><div class="flex items-center gap-3 mb-6"><img src="assets/icon-192.png" class="w-11 h-11 rounded-xl"><div><h1 class="text-xl font-bold text-slate-800">Bora Lá – Cadastro de Passageiros</h1><p class="text-sm text-slate-500">Cadastro da entidade/comitiva</p></div></div><div id="loading" class="text-sm text-slate-500">Carregando...</div><div id="app" class="hidden"><div id="info" class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm mb-6"></div><div id="alert" class="hidden rounded-lg p-3 mb-4 text-sm"></div><div id="rows" class="space-y-3"></div><div class="flex flex-col sm:flex-row gap-2 mt-5"><button id="add" class="px-4 py-3 rounded-lg border font-medium">+ Adicionar passageiro</button><button id="save" class="px-5 py-3 rounded-lg bg-emerald-600 text-white font-semibold">Enviar cadastro</button></div><p class="text-xs text-slate-500 mt-4">Após o envio, o cadastro fica bloqueado para edição. Se houver necessidade de correção, solicite ao responsável pela viagem que reabra o cadastro.</p></div></div></main><script>
const URL='https://rjuzhscynuleypaewgak.supabase.co'; const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJqdXpoc2N5bnVsZXlwYWV3Z2FrIiwicmVmIjoicmp1emhzY3ludWxlcHlhZXdnYWsiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc4ODY1NDA0MCwiZXhwIjoyMTA0MjMwMDQwfQ.enT2gJB4dy2xz_Z91tPY4ysoJ-GEEn2dpo_RHiy5jAs';
const sb=supabase.createClient(URL,KEY); const token=new URLSearchParams(location.search).get('token'); let trip=null, rows=[];
const labels={cpf:'CPF',rg:'RG',certidao_nascimento:'Certidão de nascimento'};
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function msg(t,error=true){const a=document.getElementById('alert');a.textContent=t;a.className=(error?'bg-red-50 text-red-700 border border-red-200':'bg-emerald-50 text-emerald-700 border border-emerald-200')+' rounded-lg p-3 mb-4 text-sm';a.classList.remove('hidden');}
function render(){const box=document.getElementById('rows');box.innerHTML=rows.map((p,i)=>`<div class="grid grid-cols-1 sm:grid-cols-[1fr_190px_1fr_40px] gap-2 items-end border rounded-xl p-3"><div><label class="block text-xs font-medium mb-1">${i+1}. Nome completo</label><input data-i="${i}" data-f="nome" value="${esc(p.nome)}" class="w-full px-3 py-2 border rounded-lg" placeholder="Nome completo"></div><div><label class="block text-xs font-medium mb-1">Tipo de documento</label><select data-i="${i}" data-f="tipo_documento" class="w-full px-3 py-2 border rounded-lg">${Object.entries(labels).map(([v,l])=>`<option value="${v}" ${p.tipo_documento===v?'selected':''}>${l}</option>`).join('')}</select></div><div><label class="block text-xs font-medium mb-1">Número do documento</label><input data-i="${i}" data-f="documento" value="${esc(p.documento)}" class="w-full px-3 py-2 border rounded-lg" placeholder="Número"></div><button data-del="${i}" class="px-2 py-2 text-red-600">✕</button></div>`).join('');box.querySelectorAll('[data-i]').forEach(e=>e.oninput=()=>{rows[+e.dataset.i][e.dataset.f]=e.value});box.querySelectorAll('[data-del]').forEach(e=>e.onclick=()=>{rows.splice(+e.dataset.del,1);render();});}
async function init(){if(!token){document.getElementById('loading').textContent='Link inválido.';return;} const {data,error}=await sb.rpc('get_passenger_portal',{p_token:token}); if(error||!data){document.getElementById('loading').textContent=error?.message||'Link inválido ou expirado.';return;} trip=data; document.getElementById('loading').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('info').innerHTML=`<div><b>Origem:</b> ${esc(trip.origin_name||'-')}<br><span class="text-slate-500">${esc(trip.origin_city||'')}</span></div><div><b>Destino:</b> ${esc(trip.destination||'-')}<br><span class="text-slate-500">${esc(trip.city||'')}</span></div><div><b>Data:</b> ${new Date(trip.trip_date+'T00:00').toLocaleDateString('pt-BR')}</div><div><b>Quantidade:</b> ${trip.total_passengers} passageiros</div>`; const r=await sb.rpc('get_passenger_portal_rows',{p_token:token});rows=(r.data||[]).map(x=>({nome:x.nome||'',tipo_documento:x.tipo_documento||'cpf',documento:x.documento||''})); if(!rows.length)rows=Array.from({length:trip.total_passengers},()=>({nome:'',tipo_documento:'cpf',documento:''})); if(trip.access_status==='enviado'){msg('Este cadastro já foi enviado e está bloqueado para edição.',false);document.getElementById('save').disabled=true;document.getElementById('add').disabled=true;} render();}
document.getElementById('add').onclick=()=>{if(rows.length<trip.total_passengers){rows.push({nome:'',tipo_documento:'cpf',documento:''});render();}};document.getElementById('save').onclick=async()=>{if(rows.length!==trip.total_passengers){msg(`Informe exatamente ${trip.total_passengers} passageiros.`);return;}if(trip.requires_full_list&&rows.some(p=>!p.nome.trim()||!p.documento.trim())){msg('Para esta viagem, nome e documento são obrigatórios para todos os passageiros.');return;}const {error}=await sb.rpc('save_passenger_portal',{p_token:token,p_passengers:rows});if(error){msg(error.message);return;}msg('Cadastro enviado com sucesso. Obrigado!',false);document.getElementById('save').disabled=true;document.getElementById('add').disabled=true;document.querySelectorAll('input,select,button[data-del]').forEach(e=>e.disabled=true);};init();
</script></body></html>
